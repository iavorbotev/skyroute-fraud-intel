[project]
name = "fraud-intel"
version = "0.1.0"
description = "Fraud intelligence pipeline and dashboard for SkyRoute Travel"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=18",
    "streamlit>=1.40",
]

[project.scripts]
fraud-intel = "fraud_intel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_intel"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
