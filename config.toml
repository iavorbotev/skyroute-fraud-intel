# one file drives the data generator, the risk rules, and the alerts, so every run can be reproduced
seed = 20260930
data_path = "data/transactions.csv.gz"
database_path = "data/fraud_intel.duckdb"
# the last N days are scored; everything before is the settled history the segment rates come from
scored_window_days = 30
chargeback_fee_usd = 20.0

# fixed offsets without daylight saving, close enough to decide "night in the customer's country"
[utc_offset_hours]
BR = -3
MX = -6
CO = -5
AR = -3
CL = -4

[generator]
end_date = "2026-09-30"
days_per_window = 30
transactions_per_window = 40000
customers_per_window = 26000
approval_rate = 0.83
history_fraud_rate = 0.008
# background fraud after the wave starts; the planted patterns add to it
scored_fraud_rate = 0.026
spike_start_day = 9
mean_amount_usd = 420.0
amount_sigma = 0.6
legit_ip_abroad_share = 0.02
last_minute_share = 0.06
bins_per_country = 25
bad_bins_per_country = 2
# planted pattern sizes are shares of window volume, so they stand out the same at any volume
ar_cluster_share = 0.0025
ar_cluster_start_day = 16
velocity_customer_share = 0.002
card_testing_customer_share = 0.0005
legit_high_value_share = 0.004

[generator.country_shares]
BR = 0.35
MX = 0.25
CO = 0.20
AR = 0.10
CL = 0.10

# drawn per country because PIX and Boleto exist only in BR, OXXO only in MX, PSE only in CO;
# these mixes make the overall split land on card 60, pix 20, oxxo 10, pse 5, boleto 5
[generator.method_mix.BR]
card = 0.2857
pix = 0.5714
boleto = 0.1429

[generator.method_mix.MX]
card = 0.6
oxxo = 0.4

[generator.method_mix.CO]
card = 0.75
pse = 0.25

[generator.method_mix.AR]
card = 1.0

[generator.method_mix.CL]
card = 1.0

[risk]
# how many bookings' worth of the overall rate a segment starts from before its own data counts
settled_prior_strength = 200.0
velocity_window_minutes = 60
velocity_min_attempts = 3
card_testing_min_declines = 2
card_testing_min_bins = 3
high_value_usd = 800.0
value_outlier_quantile = 0.99
last_minute_hours = 48
last_minute_min_usd = 500.0
night_start_hour = 0
night_end_hour = 6
risky_segment_multiplier = 2.0
risky_bin_multiplier = 3.0
medium_threshold = 30
high_threshold = 60

[risk.points]
velocity = 25
card_testing = 30
geo_mismatch = 20
new_customer_high_value = 20
value_outlier = 15
last_minute = 10
night_hours = 10
risky_segment = 15
risky_bin = 20

[alerts]
velocity_burst_min_attempts = 5
card_testing_min_declines = 3
card_testing_window_minutes = 30
share_spike_multiplier = 2.0
share_spike_min_high_risk = 5
country_burst_multiplier = 3.0
country_burst_min_count = 10
